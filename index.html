<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>MySudoku</title>
  <meta name="theme-color" content="#3a6fd8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MySudoku">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="home" class="screen">
      <h1>MySudoku</h1>
      <select id="lang-select" class="lang-select" aria-label="Language">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
      </select>
      <p class="sub" data-i18n="home.sub"></p>
      <div id="resume" class="resume" hidden>
        <button class="btn resume-btn" id="resume-btn"></button>
        <button class="link" id="abandon" data-i18n="home.abandon"></button>
      </div>
      <div class="levels">
        <button class="btn primary" data-level="easy" data-i18n="level.easy"></button>
        <button class="btn primary" data-level="medium" data-i18n="level.medium"></button>
        <button class="btn primary" data-level="hard" data-i18n="level.hard"></button>
        <button class="btn primary" data-level="expert" data-i18n="level.expert"></button>
      </div>
      <button class="btn learn" id="open-tutorial" data-i18n="home.tutorial"></button>
      <p id="home-msg" class="msg" role="alert"></p>
    </section>

    <section id="game" class="screen" hidden>
      <div class="topbar">
        <button class="btn" id="back" data-i18n="game.back"></button>
        <h2 id="game-title"></h2>
        <button class="btn" id="hint" data-i18n="game.hint"></button>
      </div>
      <div class="board-wrap"><div id="board" class="board"></div></div>
      <div class="controls">
        <div id="pad" class="pad"></div>
        <p class="tip" data-i18n="game.tip"></p>
        <label class="toggle"><input type="checkbox" id="hl-toggle"><span class="track"></span><span data-i18n="game.highlight"></span></label>
        <div class="actions">
          <button class="btn" id="undo" data-i18n="game.undo"></button>
          <button class="btn" id="clear-cell" data-i18n="game.clearCell"></button>
          <button class="btn" id="clear-all" data-i18n="game.clearAll"></button>
          <button class="btn primary" id="submit" data-i18n="game.submit"></button>
        </div>
      </div>
    </section>

    <section id="tutorial" class="screen" hidden>
      <div class="topbar">
        <button class="btn" id="tutorial-back" data-i18n="game.back"></button>
        <h2 id="tutorial-title"></h2>
        <span></span>
      </div>
      <div id="tutorial-body" class="help tutorial"></div>
    </section>

    <section id="result" class="screen" hidden>
      <h2 id="result-title"></h2>
      <p id="result-detail" class="sub"></p>
      <div id="answer" class="board small"></div>
      <div id="result-techs" class="result-techs" hidden></div>
      <div class="actions">
        <button class="btn primary" id="retry" data-i18n="result.retry"></button>
        <button class="btn" id="home-btn" data-i18n="result.home"></button>
      </div>
    </section>
  </main>

  <div id="leave-modal" class="modal" hidden>
    <div class="modal-box leave-box" role="dialog" aria-modal="true" aria-labelledby="leave-title">
      <h3 id="leave-title" data-i18n="leave.title"></h3>
      <p class="sub" data-i18n="leave.text"></p>
      <div class="leave-actions">
        <button class="btn primary" id="leave-save" data-i18n="leave.save"></button>
        <button class="btn" id="leave-discard" data-i18n="leave.discard"></button>
        <button class="btn" id="leave-cancel" data-i18n="leave.cancel"></button>
      </div>
    </div>
  </div>
  <div id="hint-modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" data-i18n-aria="modal.close">×</button>
      <button class="btn modal-back" id="modal-back" data-i18n="modal.back" hidden></button>
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
    </div>
  </div>
  <script src="i18n/core.js"></script>
  <script src="i18n/zh.js"></script>
  <script src="i18n/en.js"></script>
  <script src="i18n/fr.js"></script>
  <script src="i18n/content-en-1.js"></script>
  <script src="i18n/content-en-2.js"></script>
  <script src="i18n/content-fr-1.js"></script>
  <script src="i18n/content-fr-2.js"></script>
  <script src="solver/config.js"></script>
  <script src="solver/help.js"></script>
  <script src="solver/core.js"></script>
  <script src="solver/patterns.js"></script>
  <script src="solver/chains.js"></script>
  <script src="solver/als.js"></script>
  <script src="solver/forcing.js"></script>
  <script src="solver/analyze.js"></script>
  <script src="tutorial.js"></script>
  <script src="sudoku.js"></script>
  <script src="app.js"></script>
</body>
</html>
