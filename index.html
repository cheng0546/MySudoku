<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MySudoku</title>
  <meta name="theme-color" content="#3a6fd8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MySudoku">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="home" class="screen">
      <h1>MySudoku</h1>
      <p class="sub">选择难度，开始一局唯一解数独</p>
      <div class="levels">
        <button class="btn primary" data-level="easy">简单</button>
        <button class="btn primary" data-level="medium">中等</button>
        <button class="btn primary" data-level="hard">困难</button>
        <button class="btn primary" data-level="expert">专家</button>
      </div>
      <button class="btn learn" id="open-tutorial">技巧教学</button>
      <p id="home-msg" class="msg" role="alert"></p>
    </section>

    <section id="game" class="screen" hidden>
      <div class="topbar">
        <button class="btn" id="back">← 返回</button>
        <h2 id="game-title"></h2>
        <button class="btn" id="hint">💡 提示</button>
      </div>
      <div id="board" class="board"></div>
      <div id="pad" class="pad"></div>
      <p class="tip">点击格子标记待定数字，长按格子填入数字</p>
      <div class="actions">
        <button class="btn" id="undo">撤销</button>
        <button class="btn" id="clear-cell">清除此格</button>
        <button class="btn" id="clear-all">重新开始</button>
        <button class="btn primary" id="submit">提交</button>
      </div>
    </section>

    <section id="tutorial" class="screen" hidden>
      <div class="topbar">
        <button class="btn" id="tutorial-back">← 返回</button>
        <h2 id="tutorial-title">技巧教学</h2>
        <span></span>
      </div>
      <div id="tutorial-body" class="help tutorial"></div>
    </section>

    <section id="result" class="screen" hidden>
      <h2 id="result-title"></h2>
      <p id="result-detail" class="sub"></p>
      <div id="answer" class="board small"></div>
      <div class="actions">
        <button class="btn primary" id="retry">重做一次</button>
        <button class="btn" id="home-btn">返回首页</button>
      </div>
    </section>
  </main>

  <div id="hint-modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
      <button class="btn modal-back" id="modal-back" hidden>← 技巧列表</button>
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
    </div>
  </div>
  <script src="solver.js"></script>
  <script src="tutorial.js"></script>
  <script src="sudoku.js"></script>
  <script src="app.js"></script>
</body>
</html>
